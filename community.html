<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZIONBURG — Community</title><link rel="stylesheet" href="styles.css"></head><body class="page-flex"><div class="announcement" data-shipping-announcement></div><header class="site-header"><a class="brand header-brand" href="index.html"><span class="brand-desktop">ZIONBURG</span><span class="brand-mobile">ZB</span></a><nav data-site-nav></nav><div class="header-actions"><button class="icon-btn" id="cartBtn">BAG <span id="cartCount">0</span></button></div></header><main class="page-grow"><section class="page-hero"><span class="eyebrow">MOVE TOGETHER</span><h1>COMMUNITY</h1><p>Spaces, people and partnerships that make active everyday life feel more connected.</p></section><section class="page-shell"><span class="eyebrow">COMMUNITY PARTNERS</span><div class="content-grid community-grid" id="partnerGrid" style="margin-top:18px"></div><div style="height:55px"></div><span class="eyebrow">FRIENDS OF ZB</span><div class="content-grid community-grid" id="friendGrid" style="margin-top:18px"></div></section></main><footer></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-runtime.js"></script><script>(async()=>{try{if(sessionStorage.getItem("zb_supabase_hydrated_v1")!=="1"){const changed=await ZBSupa.hydrateSiteCache();if(changed){location.reload();return}}}catch(e){console.warn("Supabase preload:",e)}})();</script><script src="site-common.js"></script><script>const ce=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function communityCard(x){const name=localize(x,'name'),note=localize(x,'note'),media=x.image?`<div class="community-card-media ${x.imageFit==='contain'?'contain':''}"><img src="${ce(x.image)}" alt="${ce(name)}"></div>`:'';const inner=`${media}<div class="community-card-copy"><span class="eyebrow">${ce(x.type||'')}</span><h3>${ce(name)}</h3><p>${ce(note)}</p>${x.url?'<span class="community-card-link">VISIT →</span>':''}</div>`;return x.url?`<a class="content-card community-card" href="${ce(x.url)}" target="_blank" rel="noopener">${inner}</a>`:`<article class="content-card community-card">${inner}</article>`}document.addEventListener('DOMContentLoaded',()=>{const s=getSite();document.getElementById('partnerGrid').innerHTML=(s.partners||[]).map(communityCard).join('');document.getElementById('friendGrid').innerHTML=(s.friends||[]).map(communityCard).join('')})</script></body></html>
