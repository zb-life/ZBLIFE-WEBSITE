<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ZIONBURG — Moodboard Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Carme&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="rhode.css">
  <link rel="stylesheet" href="moodboard.css">
<style>html.zb-booting{background:#fbfaf7}html.zb-booting body{opacity:0}body{transition:opacity .2s ease}</style><script>/* Hide the page until fresh store data is in, so visitors never see placeholder photos or old menus. Max 5s. */(function(){try{var c=JSON.parse(localStorage.getItem('zb_editorial_v15')||'null'),t=c&&Date.parse(c._supabaseLoadedAt);if(!(t&&Date.now()-t<10*60*1000)){document.documentElement.classList.add('zb-booting');setTimeout(function(){document.documentElement.classList.remove('zb-booting')},5000)}}catch(e){}})();</script></head>
<body class="moodboard-page">
  <div class="announcement" data-shipping-announcement></div>
  <header class="site-header moodboard-header">
    <a class="brand header-brand" href="index.html"><span class="brand-desktop">ZIONBURG</span><span class="brand-mobile">ZB</span></a>
    <nav data-site-nav></nav>
    <div class="header-actions"><button class="icon-btn" id="cartBtn">BAG <span id="cartCount">0</span></button></div>
  </header>

  <main class="moodboard-shell">
    <section class="moodboard-intro">
      <div>
        <span class="eyebrow">ZB / VISUAL JOURNAL</span>
        <h1>MOVE.<br>RESET.<br>REFRESH.</h1>
      </div>
      <div class="moodboard-intro-copy">
        <p>A living moodboard for movement, scent, recovery and everyday rituals.</p>
        <a class="moodboard-pill moodboard-pill-dark" href="product.html">SHOP THE WIPES ↗</a>
      </div>
    </section>

    <section class="moodboard-filter" aria-label="Moodboard filters">
      <button class="active" data-board-filter="all">ALL</button>
      <button data-board-filter="product">PRODUCT</button>
      <button data-board-filter="movement">MOVEMENT</button>
      <button data-board-filter="scent">SCENTS</button>
      <button data-board-filter="ritual">RITUALS</button>
    </section>

    <section class="moodboard-grid" id="moodboardGrid"></section>
  </main>

  <footer></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-runtime.js"></script>
  <script>(async()=>{const h=document.documentElement;try{if(h.classList.contains("zb-booting")){const changed=await Promise.race([ZBSupa.hydrateSiteCache({force:true}),new Promise(r=>setTimeout(()=>r(false),4500))]);if(changed){location.reload();return}}else if(sessionStorage.getItem("zb_supabase_hydrated_v1")!=="1"){ZBSupa.hydrateSiteCache({force:true}).catch(()=>{})}}catch(e){console.warn("Supabase preload:",e)}h.classList.remove("zb-booting")})();</script>
  <script src="site-common.js"></script>
  <script src="moodboard.js"></script>
</body>
</html>
