<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZB Invoice / Receipt</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Carme&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body class="invoice-page"><div class="print-actions"><a class="small-btn" href="admin.html">ADMIN</a><button class="btn btn-dark" id="printInvoice">PRINT / SAVE PDF</button></div><main class="invoice-sheet" id="invoiceRoot"><div class="invoice-top"><div><div class="brand">ZB</div><p id="invoiceTitle">Receipt / Invoice</p></div><div class="invoice-meta"><strong id="invoiceNumber"></strong><p>Date: <span id="invoiceDate"></span><br>Order: <span id="invoiceOrder"></span></p></div></div><div class="invoice-bill"><div><h4>BILLED TO</h4><strong id="billName"></strong><p id="billEmail"></p></div><div><h4>SHIP TO</h4><p id="shipAddress"></p></div></div><table class="invoice-items"><thead><tr><th>ITEM</th><th>QTY</th><th>AMOUNT</th></tr></thead><tbody id="invoiceItems"></tbody></table><div class="invoice-totals"><div><span>Subtotal</span><strong id="invSubtotal"></strong></div><div id="invDiscountRow" hidden><span>Discount <small id="invDiscountCode"></small></span><strong id="invDiscount"></strong></div><div><span>Shipping</span><strong id="invShipping"></strong></div><div class="total"><span id="invoiceTotalLabel">Total paid</span><strong id="invTotal"></strong></div></div><div class="invoice-footer"><p id="invoiceStatusLine"></p><p>Payment method: <span id="paymentMethod"></span></p><p id="invoiceDueLine"></p><p id="invoiceReferenceLine"></p><p id="recurringInvoiceNotice" hidden></p><p>Thank you for your order.</p><p>This receipt is generated from the confirmed order record. Customer and internal copies are delivered after payment confirmation.</p></div></main><script src="site-common.js"></script><script src="invoice.js"></script></body></html>
