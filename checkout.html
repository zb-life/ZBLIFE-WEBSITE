<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZIONBURG Checkout</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Carme&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body class="checkout-page"><header class="site-header checkout-header"><a class="brand" href="index.html">ZIONBURG</a><div></div><div style="justify-self:end;font-size:10px;letter-spacing:.12em">SECURE CHECKOUT</div></header><main class="checkout-shell"><section class="checkout-form-wrap"><span class="eyebrow">CHECKOUT</span><h1>Your details</h1><form id="checkoutForm" novalidate><h3>CONTACT INFORMATION</h3><div class="checkout-account-note" id="checkoutAccountNote"></div><label>Email address *<input id="email" required type="email" autocomplete="email" placeholder="Email address"></label><h3>SHIPPING ADDRESS</h3><div class="field-grid"><label>First name *<input id="firstName" required autocomplete="given-name" placeholder="First name"></label><label>Last name *<input id="lastName" required autocomplete="family-name" placeholder="Last name"></label></div><label>Phone number *<input id="phone" required autocomplete="tel" placeholder="Phone number"></label><label>Address *<input id="address" required autocomplete="street-address" placeholder="Address"></label><div class="field-grid"><label>Country / region *<select id="country" required><option value="">Select country / region</option></select></label><label>Region / state / district *<input id="region" required autocomplete="address-level1" placeholder="Region / state / district"></label></div><label id="postalWrap">Postal code<input id="postal" autocomplete="postal-code" placeholder="Postal code"></label><p id="shippingAvailability" style="font-size:11px;color:#777;margin-top:8px"></p><h3>SHIPPING METHOD</h3><div class="shipping-options"><label class="ship-option"><input type="radio" name="ship" checked><span class="ship-copy"><strong id="shipMethodName">Standard Delivery</strong><small id="shipEstimate">Delivery timing shown at checkout</small></span><b id="shipPrice"></b></label></div><div class="payment-demo"><span class="eyebrow">STRIPE SECURE PAYMENT</span><h3>PAYMENT</h3><p style="font-size:11px;color:#777">After you continue, you’ll be redirected to Stripe’s secure checkout to complete payment.</p></div><div id="checkoutError" role="alert" style="display:none;margin:14px 0;color:#a22;font-size:12px"></div><button class="btn btn-dark full" id="checkoutSubmit" type="submit">CONTINUE TO SECURE PAYMENT →</button></form></section><aside class="order-summary"><span class="eyebrow">ORDER SUMMARY</span><div id="checkoutItems"></div><div class="totals"><div><span>Subtotal</span><b id="coSubtotal"></b></div><div id="discountRow" style="display:none"><span>Discount</span><b id="coDiscount"></b></div><div><span>Shipping</span><b id="coShipping"></b></div><div id="taxRow"><span>Tax</span><b id="coTax"></b></div><div class="grand"><span>Total</span><b id="coTotal"></b></div></div></aside></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-runtime.js"></script><script>(async()=>{try{if(sessionStorage.getItem("zb_supabase_hydrated_v1")!=="1"){const changed=await ZBSupa.hydrateSiteCache();if(changed){location.reload();return}}}catch(e){console.warn("Supabase preload:",e)}})();</script><script src="site-common.js"></script><script src="checkout.js"></script></body></html>
