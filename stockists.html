<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZIONBURG — Stockists</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body class="page-flex"><div class="announcement" data-shipping-announcement></div><header class="site-header"><a class="brand header-brand" href="index.html"><span class="brand-desktop">ZIONBURG</span><span class="brand-mobile">ZB</span></a><nav data-site-nav></nav><div class="header-actions"><button class="icon-btn" id="cartBtn">BAG <span id="cartCount">0</span></button></div></header><main class="page-grow"><section class="page-hero"><span class="eyebrow">FIND ZB</span><h1>STOCKISTS</h1><p>Discover ZIONBURG through selected retail, movement and wellness partners.</p></section><section class="page-shell"><div class="stockist-filter-bar"><label>Country / market<select id="stockistCountryFilter"><option value="all">All countries</option></select></label><label>Store type<select id="stockistTypeFilter"><option value="all">All types</option></select></label></div><div class="content-grid stockist-grid" id="stockistGrid"></div><p class="stockist-empty" id="stockistEmpty" hidden>No stockists match these filters.</p></section></main><footer></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-runtime.js"></script><script>(async()=>{try{if(sessionStorage.getItem("zb_supabase_hydrated_v1")!=="1"){const changed=await ZBSupa.hydrateSiteCache();if(changed){location.reload();return}}}catch(e){console.warn("Supabase preload:",e)}})();</script><script src="site-common.js"></script><script>
const escS=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
document.addEventListener('DOMContentLoaded',()=>{const site=getSite(),all=(site.stockists||[]).filter(x=>x.active!==false),cf=document.getElementById('stockistCountryFilter'),tf=document.getElementById('stockistTypeFilter'),grid=document.getElementById('stockistGrid'),empty=document.getElementById('stockistEmpty');const countries=[...new Set(all.map(x=>x.country).filter(Boolean))].sort(),types=[...new Set(all.map(x=>x.type).filter(Boolean))].sort();cf.innerHTML+=[...countries].map(x=>`<option value="${escS(x)}">${escS(x)}</option>`).join('');tf.innerHTML+=[...types].map(x=>`<option value="${escS(x)}">${escS(x)}</option>`).join('');function render(){const c=cf.value,t=tf.value,items=all.filter(x=>(c==='all'||x.country===c)&&(t==='all'||x.type===t));grid.innerHTML=items.map(x=>{const loc=[x.city,x.region,x.country].filter(Boolean).join(', ');return `<article class="content-card stockist-card"><div class="stockist-card-top"><span class="soft-badge">${escS(x.type||'Stockist')}</span><span class="stockist-country">${escS(x.country||'')}</span></div><h3>${escS(x.name)}</h3>${loc?`<p class="stockist-location">${escS(loc)}</p>`:''}${x.address?`<p>${escS(x.address)}</p>`:''}${x.url?`<a href="${escS(x.url)}" target="_blank" rel="noopener" class="text-pill">VISIT STORE ↗</a>`:''}</article>`}).join('');empty.hidden=items.length>0}cf.addEventListener('change',render);tf.addEventListener('change',render);render()})
</script></body></html>
