<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZIONBURG</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Carme&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="rhode.css"><link rel="stylesheet" href="page-builder.css"><style>html.zb-booting{background:#fbfaf7}html.zb-booting body{opacity:0}body{transition:opacity .2s ease}</style><script>/* Hide the page until fresh store data is in, so visitors never see placeholder photos or old menus. Max 5s. */(function(){try{var c=JSON.parse(localStorage.getItem('zb_editorial_v15')||'null'),t=c&&Date.parse(c._supabaseLoadedAt);if(!(t&&Date.now()-t<10*60*1000)){document.documentElement.classList.add('zb-booting');setTimeout(function(){document.documentElement.classList.remove('zb-booting')},5000)}}catch(e){}})();</script></head><body><div class="announcement" data-shipping-announcement></div><header class="site-header"><a class="brand header-brand" href="index.html"><span class="brand-desktop">ZIONBURG</span><span class="brand-mobile">ZB</span></a><nav data-site-nav></nav><div class="header-actions"><button class="icon-btn" id="cartBtn">BAG <span id="cartCount">0</span></button></div></header><main><section class="page-hero" id="pageHero"><span class="eyebrow">ZIONBURG</span><h1 id="pageTitle"></h1></section><div class="zbs-page" id="pageSections" data-zb-sections></div><section class="page-shell" id="pageLegacy" hidden><p id="pageBody" style="font-size:17px;line-height:1.75;max-width:760px;white-space:pre-line"></p></section></main><footer><a class="brand" href="index.html">ZIONBURG</a><div>PEOPLE. PERFORMANCE. A CLEANER TOMORROW.</div><div class="footer-nav" data-footer-nav></div><div>© 2026 ZIONBURG</div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-runtime.js"></script><script>(async()=>{const h=document.documentElement;try{if(h.classList.contains("zb-booting")){const changed=await Promise.race([ZBSupa.hydrateSiteCache({force:true}),new Promise(r=>setTimeout(()=>r(false),4500))]);if(changed){location.reload();return}}else if(sessionStorage.getItem("zb_supabase_hydrated_v1")!=="1"){ZBSupa.hydrateSiteCache({force:true}).catch(()=>{})}}catch(e){console.warn("Supabase preload:",e)}h.classList.remove("zb-booting")})();</script><script src="site-common.js"></script><script src="page-sections.js"></script>
<script>
function renderCustomPage(){
  const params=new URLSearchParams(location.search),slug=params.get('slug')||'';
  const p=(getSite().pages||[]).find(x=>x.slug===slug);
  const hero=document.getElementById('pageHero'),title=document.getElementById('pageTitle'),host=document.getElementById('pageSections'),legacy=document.getElementById('pageLegacy');
  if(!p){title.textContent='page not found';host.innerHTML='';legacy.hidden=false;document.getElementById('pageBody').textContent='This page has not been created yet.';return}
  title.textContent=localize(p,'title');
  const sections=Array.isArray(p.sections)?p.sections:[];
  if(sections.length){
    host.innerHTML=ZBPageSections.renderSections(sections);legacy.hidden=true;
    hero.hidden=sections[0]?.type==='banner';
  }else{
    host.innerHTML='';legacy.hidden=false;hero.hidden=false;
    document.getElementById('pageBody').textContent=localize(p,'body');
  }
  if(typeof applySeoMeta==='function')applySeoMeta({pageTitle:localize(p,'title'),description:p.seoDescription||ZBPageSections.pageText(sections)||localize(p,'body')||''});
}
document.addEventListener('DOMContentLoaded',()=>{
  renderCustomPage();
  // Load the click-to-edit editor for signed-in staff (or when ?edit=page is in the address).
  let signedIn=false;try{signedIn=Object.keys(localStorage).some(k=>/^sb-.*-auth-token$/.test(k))}catch{}
  if(new URLSearchParams(location.search).get('edit')==='page'||signedIn){const s=document.createElement('script');s.src='page-editor.js';document.body.appendChild(s)}
});
</script></body></html>
