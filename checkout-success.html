<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thank you — ZIONBURG</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Carme&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html">ZIONBURG</a></header><main style="max-width:760px;margin:120px auto;padding:24px;text-align:center"><span class="eyebrow">ORDER STATUS</span><h1 id="successTitle">VERIFYING PAYMENT…</h1><p id="successCopy">Please wait while we confirm your Stripe payment.</p><a class="btn btn-dark" href="index.html" id="continueShop" style="display:none">BACK TO STORE</a></main><script src="site-common.js"></script><script>(async()=>{const p=new URLSearchParams(location.search),id=p.get('session_id'),title=document.getElementById('successTitle'),copy=document.getElementById('successCopy'),btn=document.getElementById('continueShop');try{const r=await fetch('/.netlify/functions/checkout-session-status?session_id='+encodeURIComponent(id||''),{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not verify payment');if(d.payment_status==='paid'){saveCart([]);title.textContent='PAYMENT CONFIRMED';copy.textContent='Thank you. Your payment has been received securely through Stripe.';btn.style.display='inline-flex'}else{title.textContent='PAYMENT NOT COMPLETED';copy.textContent='Your payment has not been confirmed. You can return to checkout and try again.';btn.textContent='RETURN TO STORE';btn.style.display='inline-flex'}}catch(e){title.textContent='WE COULDN’T VERIFY THE PAYMENT';copy.textContent='Please contact ZIONBURG if you were charged and need assistance.';btn.style.display='inline-flex'}})();</script></body></html>
